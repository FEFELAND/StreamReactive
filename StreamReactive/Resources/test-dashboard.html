<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>StreamReactive Test Dashboard</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', system-ui, sans-serif; background: #1a1a2e; color: #eee; padding: 24px; }
  h1 { font-size: 1.6rem; margin-bottom: 6px; }
  .subtitle { color: #888; margin-bottom: 20px; font-size: 0.9rem; }
  .status { display: inline-block; padding: 4px 14px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; margin-bottom: 20px; }
  .connected { background: #1b5e20; color: #81c784; }
  .disconnected { background: #b71c1c; color: #ef9a9a; }
  .card { background: #16213e; border-radius: 12px; padding: 18px; margin-bottom: 16px; }
  .card h2 { font-size: 1.1rem; margin-bottom: 12px; color: #7ec8e3; }
  nav { margin-bottom: 20px; }
  nav a { display: inline-block; padding: 8px 16px; border-radius: 8px 8px 0 0; color: #aaa; text-decoration: none; font-weight: 600; font-size: 0.9rem; }
  nav a:hover { color: #eee; }
  nav a.active { background: #16213e; color: #7ec8e3; }
  .btn-grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .btn { padding: 10px 20px; border: none; border-radius: 8px; font-size: 0.9rem; font-weight: 600; cursor: pointer; color: #fff; transition: filter .15s; }
  .btn:hover { filter: brightness(1.2); }
  .btn:active { filter: brightness(0.85); }
  .btn-bits { background: #ffd700; color: #000; }
  .btn-sub { background: #ff69b4; }
  .btn-gift { background: #c084fc; }
  .btn-raid { background: #ff4500; }
  .btn-skip { background: #ffb300; color: #000; }
  .btn-custom { background: #78909c; }
  .btn-throw { background: #26a69a; }
  .btn-on { background: #2e7d32; }
  .btn-off { background: #b71c1c; }
  .btn-resume { background: #2e7d32; }
  .field { margin-bottom: 10px; }
  .field label { display: block; font-size: 0.8rem; color: #aaa; margin-bottom: 3px; }
  .field input, .field select { width: 100%; padding: 8px 10px; border-radius: 6px; border: 1px solid #333; background: #0f3460; color: #eee; font-size: 0.9rem; }
  .field select { appearance: auto; }
  .field input:focus { outline: none; border-color: #7ec8e3; }
.field-row { display: flex; gap: 10px; flex-wrap: wrap; }
.field-row .field { flex: 1; min-width: 180px; }
  .log { background: #0d1b2a; border-radius: 8px; padding: 12px; max-height: 180px; overflow-y: auto; font-family: 'Cascadia Code', 'Fira Code', monospace; font-size: 0.8rem; }
  .log-entry { padding: 2px 0; border-bottom: 1px solid #1a1a2e; }
  .log-entry:last-child { border-bottom: none; }
  .log-time { color: #666; }
  .log-ok { color: #81c784; }
  .log-err { color: #ef9a9a; }
</style>
</head>
<body>
<nav>
  <a href="/">Test Dashboard</a>
  <a href="/generator">Message Generator</a>
</nav>
<h1>StreamReactive Test Dashboard</h1>
<p class="subtitle">Send test stream events to the mod while in-game</p>
<div id="statusBadge" class="status disconnected">Disconnected</div>

<div class="card">
  <h2>Controls</h2>
  <div class="btn-grid">
    <button class="btn btn-on" onclick="sendSocket(true)">Enable</button>
    <button class="btn btn-off" onclick="sendSocket(false)">Disable</button>
    <button class="btn" style="background: #ff8f00; color: #000;" onclick="sendPause()">Pause</button>
    <button class="btn btn-resume" onclick="sendUnpause()">Unpause</button>
  </div>
</div>

<div class="card">
  <h2>Quick Events</h2>
  <div class="btn-grid">
    <button class="btn btn-bits" onclick="sendEvent('bits', 'TwitchUser', 50)">Bits 50</button>
    <button class="btn btn-bits" onclick="sendEvent('bits', 'TwitchUser', 100)">Bits 100</button>
    <button class="btn btn-bits" onclick="sendEvent('bits', 'TwitchUser', 1000)">Bits 1000</button>
    <button class="btn btn-bits" onclick="sendEvent('bits', 'TwitchUser', 5000)">Bits 5000</button>
    <button class="btn btn-bits" onclick="sendEvent('bits', 'TwitchUser', 10000)">Bits 10000</button>
    <button class="btn btn-sub" onclick="sendEvent('subscription', 'NewSub', 1)">Sub</button>
    <button class="btn btn-gift" onclick="sendEvent('subscription_gift', 'Gifter', 5)">Gift 5</button>
    <button class="btn btn-raid" onclick="sendEvent('raid', 'Raider', 50)">Raid 50</button>
    <button class="btn" style="background: #ff6600;" onclick="sendEvent('bomb', 'You', 1)">Test Bomb</button>
    <button class="btn" style="background: #ff6600;" onclick="sendEvent('bomb', 'You', 1, 'This is a test message')">Bomb + Message</button>
    <button class="btn btn-throw" onclick="sendEvent('throw', '', 1)">Throw Cube</button>
    <button class="btn btn-throw" onclick="sendEvent('throw', '', 5)">Throw 5</button>
    <button class="btn" style="background: #ffffff; color: #000;" onclick="sendFlashbang()">Flashbang</button>
    <button class="btn" style="background: #7b1fa2; color: #fff;" onclick="sendProj('star')">Star</button>
    <button class="btn" style="background: #e65100; color: #fff;" onclick="sendProj('nuke')">Nuke</button>
    <button class="btn" style="background: #0277bd; color: #fff;" onclick="sendProj('pulse')">Pulse</button>
    <button class="btn" style="background: #00695c; color: #fff;" onclick="sendProj('spiral')">Spiral</button>
    <button class="btn btn-skip" onclick="sendSkip()">Skip Current</button>
    <button class="btn btn-custom" onclick="sendStopAll()" style="background: #b71c1c;">Stop All</button>
  </div>
</div>

<div class="card">
  <h2>Custom Event</h2>
  <div class="field">
    <label>Type</label>
    <select id="customType">
      <option value="bits">Bits / Cheer</option>
      <option value="subscription">Subscription</option>
      <option value="subscription_gift">Gift Sub</option>
      <option value="raid">Raid</option>
      <option value="bomb">Bomb</option>
      <option value="throw">Throw Projectiles</option>
      <option value="flashbang">Flashbang</option>
      <option value="projection">Projection</option>
      <option value="cubeanimation">Lurk (Cube Animation)</option>
    </select>
  </div>
  <div id="customFields" class="field-row"></div>
  <button class="btn btn-custom" onclick="sendCustomEvent()">Send Custom Event</button>
</div>

<div class="card">
  <h2>Event Log</h2>
  <div id="log" class="log"></div>
</div>

<script>
const port = PORT_PLACEHOLDER;
let ws = null;
let lastSend = 0;
const DEBOUNCE_MS = 200;

function connect() {
  if (ws && ws.readyState === WebSocket.OPEN) return;
  const url = 'ws://' + location.hostname + ':' + port + '/stream';
  ws = new WebSocket(url);
  ws.onopen = function() {
    document.getElementById('statusBadge').className = 'status connected';
    document.getElementById('statusBadge').textContent = 'Connected';
    log('Connected to mod', 'ok');
  };
  ws.onclose = function() {
    document.getElementById('statusBadge').className = 'status disconnected';
    document.getElementById('statusBadge').textContent = 'Reconnecting...';
    setTimeout(connect, 500);
  };
  ws.onerror = function() {
    log('WebSocket error', 'err');
  };
}

function sendEvent(type, user, amount, message, color) {
  var now = Date.now();
  if (now - lastSend < DEBOUNCE_MS) {
    log('Please wait...', 'err');
    return;
  }
  lastSend = now;

  var data = {};
  if (user) data.user = user;
  if (amount || amount === 0) data.amount = amount;
  if (message) data.message = message;
  if (color) data.color = color;

  var payload = { type: type, data: data };
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(payload));
    log(type + ' - ' + (user || '') + (amount ? ' (' + amount + ')' : ''), 'ok');
  } else {
    log('Not connected', 'err');
  }
}

// Per-type field definitions — matches the Message Generator. Each event only
// shows the variables that event actually accepts.
const CUSTOM_EVENTS = {
  bits: {
    fields: [
      { key: 'user', label: 'Username', required: true, num: false, value: 'TestUser' },
      { key: 'amount', label: 'Bits amount', required: true, num: true, value: '100' },
      { key: 'color', label: 'Color (hex)', required: false, num: false, value: '', hint: 'optional — otherwise tier colors apply' }
    ]
  },
  subscription: {
    fields: [
      { key: 'user', label: 'Username', required: true, num: false, value: 'TestUser' },
      { key: 'amount', label: 'Months subscribed', required: false, num: true, value: '1' },
      { key: 'color', label: 'Color (hex)', required: false, num: false, value: '', hint: 'optional' }
    ]
  },
  subscription_gift: {
    fields: [
      { key: 'user', label: 'Gifter username', required: true, num: false, value: 'TestUser' },
      { key: 'amount', label: 'Subs gifted', required: true, num: true, value: '5' },
      { key: 'color', label: 'Color (hex)', required: false, num: false, value: '', hint: 'optional' }
    ]
  },
  raid: {
    fields: [
      { key: 'user', label: 'Raid leader', required: true, num: false, value: 'TestUser' },
      { key: 'amount', label: 'Viewers', required: true, num: true, value: '50' },
      { key: 'color', label: 'Color (hex)', required: false, num: false, value: '', hint: 'optional' }
    ]
  },
  bomb: {
    fields: [
      { key: 'user', label: 'Username', required: true, num: false, value: 'TestUser' },
      { key: 'amount', label: 'Notes to explode', required: false, num: true, value: '1' },
      { key: 'color', label: 'Color (hex)', required: false, num: false, value: '', hint: 'optional' },
      { key: 'message', label: 'Message', required: false, num: false, value: '', hint: 'optional — floats above the bombs' }
    ]
  },
  throw: {
    fields: [
      { key: 'amount', label: 'Projectiles', required: false, num: true, value: '1' },
      { key: 'scale', label: 'Note Scale', required: false, num: true, value: '', hint: 'override in-game scale, e.g. 1.5' },
      { key: 'spawn', label: 'Spawn Point', required: false, options: ['Twin Cannons', 'Random Around', 'Front Center', 'Horizon Front'], value: '' },
      { key: 'arc', label: 'Arc / Flight Time (sec)', required: false, num: true, value: '', hint: 'override in-game air time' }
    ]
  },
  flashbang: {
    control: true,
    note: 'White-out flash in the headset only. No fields needed.'
  },
  projection: {
    fields: [
      { key: 'name', label: 'Projection name', required: false, num: false, value: 'star', hint: 'star, nuke, pulse, spiral, or an OBJ filename' },
      { key: 'color', label: 'Color (hex)', required: false, num: false, value: '', hint: 'optional' },
      { key: 'duration', label: 'Duration (seconds)', required: false, num: true, value: '', hint: 'override in-game default' },
      { key: 'size', label: 'Size (meters)', required: false, num: true, value: '', hint: 'override in-game default' },
      { key: 'positionX', label: 'Position X', required: false, num: true, value: '', hint: 'world offset (default 0)' },
      { key: 'positionY', label: 'Position Y', required: false, num: true, value: '', hint: 'world offset (default 1.5 above floor)' },
      { key: 'positionZ', label: 'Position Z / Distance', required: false, num: true, value: '', hint: 'in front of player (default 10)' },
      { key: 'rotationX', label: 'Rotation X (deg)', required: false, num: true, value: '' },
      { key: 'rotationY', label: 'Rotation Y (deg)', required: false, num: true, value: '' },
      { key: 'rotationZ', label: 'Rotation Z (deg)', required: false, num: true, value: '' }
    ]
  },
  cubeanimation: {
    fields: [
      { key: 'user', label: 'Username', required: true, num: false, value: 'TestUser' },
      { key: 'scale', label: 'Note Scale', required: false, num: true, value: '', hint: 'override in-game Note Scale, e.g. 0.6' }
    ]
  }
};

function renderCustomFields() {
  var type = document.getElementById('customType').value;
  var ev = CUSTOM_EVENTS[type] || { fields: [] };
  var container = document.getElementById('customFields');
  container.innerHTML = '';
  if (ev.note) {
    var p = document.createElement('p');
    p.style.color = '#888';
    p.style.fontSize = '0.85rem';
    p.style.width = '100%';
    p.textContent = ev.note;
    container.appendChild(p);
  }
  (ev.fields || []).forEach(function(f) {
    var div = document.createElement('div');
    div.className = 'field';
    var labelHtml = '<label>' + f.label + (f.required ? ' <span style="color:#ef5350;font-size:0.7rem;">required</span>' : '') + '</label>';
    if (f.options) {
      var opts = [''].concat(f.options);
      var rows = opts.map(function(o) {
        var text = o === '' ? '(default)' : o;
        return '<option value="' + o + '">' + text + '</option>';
      }).join('');
      div.innerHTML = labelHtml + '<select data-key="' + f.key + '">' + rows + '</select>';
    } else {
      var inputType = f.num ? 'number' : 'text';
      div.innerHTML = labelHtml +
        '<input data-key="' + f.key + '" type="' + inputType + '" value="' + (f.value || '') + '"' +
        (f.hint ? ' placeholder="' + f.hint.replace(/"/g, '&quot;') + '"' : '') + '>';
    }
    container.appendChild(div);
  });
}

function customValues() {
  var vals = {};
  document.querySelectorAll('#customFields input, #customFields select').forEach(function(inp) {
    vals[inp.dataset.key] = inp.value.trim();
  });
  return vals;
}

function customPayload() {
  var type = document.getElementById('customType').value;
  var ev = CUSTOM_EVENTS[type] || { fields: [] };
  if (ev.control) return { type: type, data: null, missing: [] };
  var vals = customValues();
  var data = {};
  var missing = [];
  (ev.fields || []).forEach(function(f) {
    var v = vals[f.key];
    if (v === '') {
      if (f.required) missing.push(f.label);
      return;
    }
    if (f.num && isFinite(v)) data[f.key] = Number(v);
    else data[f.key] = v;
  });
  return { type: type, data: data, missing: missing };
}

function sendCustomEvent() {
  var payload = customPayload();
  if (payload.missing.length) {
    log('Missing required: ' + payload.missing.join(', ') + ' — omitted from payload', 'ok');
  }
  var msg = payload.data === null
    ? { type: payload.type }
    : { type: payload.type, data: payload.data };
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify(msg));
    log(payload.type + ' sent', 'ok');
  } else {
    log('Not connected', 'err');
  }
}

document.getElementById('customType').addEventListener('change', renderCustomFields);
renderCustomFields();

function sendStopAll() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'stop_all' }));
    log('Stop all effects sent', 'ok');
  } else {
    log('Not connected', 'err');
  }
}

function sendSocket(on) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'socket', data: { on: on } }));
    log('Socket ' + (on ? 'enabled' : 'disabled') + ' sent', 'ok');
  } else {
    log('Not connected', 'err');
  }
}

function sendPause() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'pause' }));
    log('Pause sent', 'ok');
  } else {
    log('Not connected', 'err');
  }
}

function sendUnpause() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'unpause' }));
    log('Unpause sent', 'ok');
  } else {
    log('Not connected', 'err');
  }
}

function sendSkip() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'skip' }));
    log('Skip current event sent', 'ok');
  } else {
    log('Not connected', 'err');
  }
}

function sendFlashbang() {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'flashbang' }));
    log('Flashbang sent', 'ok');
  } else {
    log('Not connected', 'err');
  }
}

function sendProj(name) {
  if (ws && ws.readyState === WebSocket.OPEN) {
    ws.send(JSON.stringify({ type: 'projection', data: { name: name } }));
    log('Projection: ' + name, 'ok');
  } else {
    log('Not connected', 'err');
  }
}

function log(msg, cls) {
  var el = document.getElementById('log');
  var div = document.createElement('div');
  div.className = 'log-entry';
  div.innerHTML = '<span class="log-time">[' + new Date().toLocaleTimeString() + ']</span> <span class="log-' + cls + '">' + msg + '</span>';
  el.appendChild(div);
  el.scrollTop = el.scrollHeight;
}

connect();

if (location.pathname.endsWith('/generator')) {
  document.querySelectorAll('nav a').forEach(function(a) {
    if (a.getAttribute('href') === '/generator') a.classList.add('active');
  });
} else {
  document.querySelectorAll('nav a').forEach(function(a) {
    if (a.getAttribute('href') === '/') a.classList.add('active');
  });
}
</script>
</body>
</html>
